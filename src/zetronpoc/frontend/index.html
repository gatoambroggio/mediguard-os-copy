<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>ZetronPOC · MediGuard OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600&display=swap');
:root{--bg:#05060f;--panel:rgba(10,15,31,.7);--line:rgba(0,240,255,.18);--txt:#d8e6ff;--mut:#5d7494;--acc:#00f0ff;--acc2:#ff00d4;--acc3:#7c5cff;--ok:#00ff9d}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Rajdhani',sans-serif}
body{min-height:100vh;color:var(--txt);background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 600px at 10% -10%,rgba(0,240,255,.12),transparent 60%),radial-gradient(820px 520px at 100% 0%,rgba(255,0,212,.10),transparent 55%);z-index:0}
body::after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,240,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.04) 1px,transparent 1px);background-size:44px 44px;z-index:0;animation:g 30s linear infinite}
@keyframes g{to{background-position:44px 44px}}
.wrap{max-width:560px;margin:auto;padding:2rem;position:relative;z-index:1;width:100%}
.head{text-align:center;margin-bottom:1.4rem}
.logo{width:74px;height:74px;border-radius:20px;display:grid;place-items:center;margin:0 auto 1rem;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));color:#05060f;font-size:38px;font-weight:900;font-family:'Orbitron';box-shadow:0 0 40px rgba(0,240,255,.5)}
h1{font-family:'Orbitron';font-size:1.6rem;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.06em}
.sub{color:var(--mut);letter-spacing:.3em;font-size:.7rem;text-transform:uppercase;margin-top:.3rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tabbtn{flex:1;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:.6rem;background:var(--panel);color:var(--mut);font-family:'Orbitron';font-weight:700;font-size:.78rem;letter-spacing:.05em;transition:.15s}
.tabbtn.active{background:linear-gradient(135deg,var(--acc),var(--acc3));color:#04060d;border:none}
.card{background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;padding:1.6rem;box-shadow:0 0 50px rgba(0,240,255,.1);margin-bottom:1rem}
label{display:block;font-size:.66rem;color:var(--mut);margin-bottom:.3rem;letter-spacing:.1em;text-transform:uppercase}
input,textarea,select{width:100%;background:rgba(8,11,26,.9);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:.55rem .7rem;font-size:.95rem;outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(0,240,255,.12)}
.list{position:relative;margin-top:.4rem}
ul{position:absolute;z-index:5;left:0;right:0;background:rgba(8,11,26,.98);border:1px solid var(--line);border-radius:9px;max-height:240px;overflow:auto;list-style:none;padding:.3rem}
li{padding:.5rem .6rem;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
li:hover{background:rgba(0,240,255,.1)}
.muted{font-size:.7rem;color:var(--mut)}
.tag{font-size:.62rem;color:var(--acc);font-weight:700}
.btn{width:100%;margin-top:1rem;cursor:pointer;border:none;border-radius:10px;padding:.7rem;font-family:'Orbitron';font-weight:700;font-size:.85rem;background:linear-gradient(135deg,var(--acc),var(--acc3));color:#04060d;letter-spacing:.05em;box-shadow:0 0 24px rgba(0,240,255,.35)}
.btn:hover{box-shadow:0 0 32px rgba(0,240,255,.55)}
.dlbtn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--acc);border-radius:9px;padding:.5rem 1.1rem;font-family:'Orbitron';font-weight:700;font-size:.74rem;letter-spacing:.04em}
.toast{margin-top:1rem;padding:.7rem;border-radius:9px;font-size:.85rem;display:none}
.toast.show{display:block}
.toast.ok{background:rgba(0,255,157,.1);border:1px solid rgba(0,255,157,.3);color:var(--ok)}
.toast.err{background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.3);color:#ff3b5c}
table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:.6rem}
th,td{text-align:left;padding:.4rem;border-bottom:1px solid rgba(0,240,255,.08)}
th{color:var(--mut);font-size:.6rem;text-transform:uppercase;letter-spacing:.08em}
.badge{padding:.1rem .4rem;border-radius:999px;font-size:.64rem;font-family:monospace}
.badge.ok{background:rgba(0,255,157,.14);color:var(--ok)}
.badge.err{background:rgba(255,59,92,.14);color:#ff3b5c}
.badge.mut{background:rgba(93,116,148,.14);color:var(--mut)}
.hrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.stat{position:fixed;top:1rem;right:1rem;z-index:2}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .7rem;border-radius:999px;font-size:.7rem;background:rgba(0,255,157,.1);color:var(--ok);border:1px solid rgba(0,255,157,.3);font-weight:600}
.pill.off{background:rgba(255,59,92,.1);color:#ff3b5c;border-color:rgba(255,59,92,.3)}
</style></head>
<body>
<div class="stat"><span id="h" class="pill">…</span></div>
<div class="wrap">
  <div class="head"><div class="logo">⏧</div><h1>ZetronPOC</h1><div class="sub">MediGuard OS · Despacho</div></div>
  <div class="tabs">
    <button class="tabbtn active" id="tb-enviar" onclick="showTab('enviar')">Enviar</button>
    <button class="tabbtn" id="tb-hist" onclick="showTab('hist')">Historial</button>
  </div>
  <div class="tabpane active" id="tp-enviar">
    <div class="card">
      <label>Buscar destinatario</label>
      <input id="q" autocomplete="off" placeholder="Nombre, codigo o area...">
      <ul id="list" style="display:none"></ul>
      <div style="margin-top:1rem"><label>Mensaje alfanumerico</label><textarea id="msg" rows="3" placeholder="Escriba el mensaje al pager..."></textarea></div>
      <button class="btn" onclick="send()">TRANSMITIR</button>
      <div id="res" class="toast"></div>
    </div>
  </div>
  <div class="tabpane" id="tp-hist">
    <div class="card">
      <div class="hrow">
        <label style="margin:0">Historial de envios</label>
        <button class="dlbtn" onclick="descargarHistorial()">Descargar CSV</button>
      </div>
      <div style="max-height:360px;overflow:auto">
        <table><thead><tr><th>Fecha</th><th>Origen</th><th>Codigo</th><th>Cap</th><th>Mensaje</th><th>Estado</th></tr></thead>
        <tbody id="histBody"><tr><td colspan="6" style="text-align:center;opacity:.6;padding:.6rem">Cargando...</td></tr></tbody></table>
      </div>
    </div>
  </div>
</div>
<script>
let chosen=null,t=null;
function showTab(id){document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.remove('active');});document.querySelectorAll('.tabpane').forEach(function(p){p.classList.remove('active');});document.getElementById('tb-'+id).classList.add('active');document.getElementById('tp-'+id).classList.add('active');if(id==='hist')loadHistorial();}
const q=document.getElementById('q'),list=document.getElementById('list');
q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(async()=>{const r=await fetch('/api/pagers'+(q.value?('?q='+encodeURIComponent(q.value)):'')).then(r=>r.json()).catch(()=>[]);const g=await fetch('/api/grupos'+(q.value?('?q='+encodeURIComponent(q.value)):'')).then(r=>r.json()).catch(()=>[]);const out=[];(r||[]).filter(x=>x.activo).forEach(x=>out.push({c:x.codigo,l:((x.nombre||'')+' '+(x.apellido||'')).trim()||x.codigo,t:'pager'}));(g||[]).filter(x=>x.activo).forEach(x=>out.push({c:x.codigo,l:x.nombre||x.codigo,t:'grupo'}));list.innerHTML=out.map(x=>`<li onclick="pick('${x.c}','${(x.l||'').replace(/'/g,'')}')"><span>${x.l} <span class="muted">${x.c}</span></span><span class="tag">${x.t}</span></li>`).join('');list.style.display=out.length?'block':'none';},180);});
document.addEventListener('click',e=>{if(e.target.id!=='q')list.style.display='none';});
function pick(c,l){chosen=c;q.value=l+' ('+c+')';list.style.display='none';}
async function send(){const t=document.getElementById('res');if(!chosen){t.className='toast show err';t.textContent='Seleccione destinatario';return;}const m=document.getElementById('msg').value.trim();if(!m){t.className='toast show err';t.textContent='Escriba un mensaje';return;}t.className='toast show ok';t.textContent='Transmitiendo...';try{const r=await fetch('/api/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:chosen,mensaje:m,origen:'publico'})}).then(r=>r.json());if(r.status==='enviado'){t.className='toast show ok';t.textContent='Mensaje transmitido.';document.getElementById('msg').value='';loadHistorial();}else if(r.status==='encolado'){t.className='toast show ok';t.textContent='Encolado (en proceso).';loadHistorial();}else{t.className='toast show err';t.textContent='Error: '+(r.detalle||'fallo');}}catch(e){t.className='toast show err';t.textContent='Error de conexion';}}
async function loadHistorial(){try{const r=await fetch('/api/historial/public').then(function(r){return r.json();});const rows=(r&&r.rows)||[];const tb=document.getElementById('histBody');if(!rows.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;opacity:.6;padding:.6rem">Sin envios</td></tr>';return;}tb.innerHTML=rows.map(function(x){var e=x.estado||'-';var cls=e==='enviado'?'ok':e==='error'?'err':'mut';return '<tr><td>'+String(x.fecha_hora||'').slice(0,16)+'</td><td>'+(x.interno_origen||'-')+'</td><td>'+(x.codigo||'-')+'</td><td>'+(x.cap_code||'-')+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+String(x.mensaje||'').replace(/"/g,'&quot;')+'">'+(x.mensaje||'')+'</td><td><span class="badge '+cls+'">'+e+'</span></td></tr>';}).join('');}catch(e){document.getElementById('histBody').innerHTML='<tr><td colspan="6" style="text-align:center;color:#ff3b5c;padding:.6rem">Error al cargar historial</td></tr>';}}
async function descargarHistorial(){try{var r=await fetch('/api/historial/public').then(function(r){return r.json();});var rows=(r&&r.rows)||[];var lines=['fecha_hora,interno,codigo,cap_code,mensaje,baudios,estado,observaciones'];rows.forEach(function(x){lines.push([x.fecha_hora,x.interno_origen,x.codigo,x.cap_code,JSON.stringify(x.mensaje||''),x.baudios,x.estado,JSON.stringify(x.observaciones||'')].join(','));});var txt=lines.join('\n');var blob=new Blob([txt],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='historial_zetronpoc.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}catch(e){alert('No se pudo descargar el historial');}}
async function health(){try{const h=await fetch('/api/health').then(r=>r.json());const p=document.getElementById('h');p.textContent=h.status==='ok'?'EN LINEA':'CAIDO';p.className='pill '+(h.status==='ok'?'':'off');}catch(e){}}
health();setInterval(health,20000);loadHistorial();
</script>
</body></html>
