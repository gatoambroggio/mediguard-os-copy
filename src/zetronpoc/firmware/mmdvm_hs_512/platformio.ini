; platformio.ini de ejemplo para el fork POCSAG_512.
;
; AJUSTA el env a la placa real de tu Jumbospot (board/stm32). El flag critico
; es -DPOCSAG_512 junto al define de TCXO correcto. El resto de los envs
; (zumspot-144, zumspot-430, jumbospot, etc.) usan los mismos build_flags base
; que el MMDVM_HS oficial; copia estos build_flags al env que uses.
;
; El binario queda en .pio/build/<env>/firmware.bin

[platformio]
default_envs = pocsag512-144

[env]
platform      = ststm32
framework     = stm32cube
board         = stm32f103cb
build_flags =
  -Wl,--gc-sections
  -DPLATFORMIO

; --- Variante 14.7456 MHz (ZumSpot / Jumbospot actuales) - VHF 144 MHz ---
; Usar este si tu placa tiene TCXO 14.7456 MHz (lo mas comun).
[env:pocsag512-144]
extends = env
build_flags =
  ${env.build_flags}
  -DADF7021_14_7456
  -DPOCSAG_512
  -DZUMSPOT_144

; --- Variante 12.2880 MHz (placas viejas) ---
; Descomentar si tu Jumbospot usa TCXO 12.2880 MHz.
; [env:pocsag512-122880]
; extends = env
; build_flags =
;   ${env.build_flags}
;   -DADF7021_12_2880
