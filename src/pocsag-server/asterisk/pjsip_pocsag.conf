; ============================================================================
; asterisk/pjsip_pocsag.conf - Endpoint SIP del interno de paginación
; Ejemplo: el interno 2184 se registra y usa el contexto pocsag-incoming.
; Requiere que pjsip.conf incluya este archivo: #include pjsip_pocsag.conf
; ============================================================================
[pocsag-endpoint]
type=endpoint
context=pocsag-incoming
disallow=all
allow=ulaw,alaw
transport=transport-udp
auth=pocsag-auth
aors=pocsag-aor

[pocsag-auth]
type=auth
auth_type=userpass
username=2184
password=CAMBIAR_PASSWORD_2184

[pocsag-aor]
type=aor
max_contacts=1

; Trunk de entrada opcional (descomentar y ajustar si la central externa enruta acá)
; [trunk-entrada]
; type=peer
; host=192.168.1.10
; context=pocsag-incoming