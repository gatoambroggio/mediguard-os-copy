# ============================================================================
# config/server.conf - Configuración global del sistema POCSAG
# ============================================================================
[general]
app_dir       = /opt/pocsag-server
db_path       = /opt/pocsag-server/database/pocsag.db
log_file      = /opt/pocsag-server/logs/pocsag.log
audio_dir     = /opt/pocsag-server/audio

[asterisk]
agi_bin       = /var/lib/asterisk/agi-bin
sounds_dir    = /var/lib/asterisk/sounds
intern        = 2184
incoming_ctx  = pocsag-incoming

[radio]
# Opciones: gpio | serial | sdr
ptt_mode      = gpio
gpio_chip     = gpiochip4
gpio_pin      = 17
default_baud  = 1200
# Desviación objetivo en kHz (calibrar con instrumentos)
deviation_khz = 4.5
audio_device  = plughw:0,0

[encoder]
# backend: python | f4exb | rtl-pager
backend       = python
sample_rate   = 22050

[backend_api]
host          = 127.0.0.1
port          = 8080