# ============================================================================
# config/server.conf - Configuraci�n global del sistema POCSAG
# ============================================================================
[general]
app_dir       = /opt/pocsag-server
db_path       = /opt/pocsag-server/database/pocsag.db
log_file      = /opt/pocsag-server/logs/pocsag.log
audio_dir     = /opt/pocsag-server/audio

[asterisk]
agi_bin       = /var/lib/asterisk/agi-bin
sounds_dir    = /var/lib/asterisk/sounds
intern        = 2184
incoming_ctx  = pocsag-incoming

[encoder]
# backend: python | f4exb | rtl-pager
backend       = python
sample_rate   = 22050
# El sistema solo encodea a POCSAG 512 baud (fijo, sin parametros de transmisor).

[backend_api]
host          = 127.0.0.1
port          = 8080