; ============================================================================
; extensions.conf - ZetronPOC v1.0 - IVR de paginacion hospitalaria
; ============================================================================
; CONTEXTO UNICO: toda llamada entrante de FreePBX cae en [from-hospital].
; Se contesta (Answer) de inmediato y arranca el IVR igual al 2184.
; No hay Goto entre contextos: todo vive en una sola extension (ivr) para
; evitar que la llamada se quede sonando sin contestar.
; ============================================================================

[general]
priorityjumping=no

[from-hospital]
; Cualquier interno marcado desde la central -> IVR
exten => _X.,1,NoOp(=== ZetronPOC IVR - llamada entrante de ${CALLERID(num)} ===)
 same => n,Goto(ivr,1)

; Llamada sin extension (algunas centrales envian "s")
exten => s,1,NoOp(=== ZetronPOC IVR - llamada sin extension ===)
 same => n,Goto(ivr,1)

; Test de audio: marcar *99 reproduce dos beeps (verifica que contesta)
exten => *99,1,Answer()
 same => n,Playback(beep)
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Hangup()

; === IVR (extension interna concreta, no patron) ===
exten => ivr,1,NoOp(=== ZetronPOC IVR ===)
 same => n,Answer()
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=30)
 same => n,Set(CHANNEL(language)=es)
 ; --- Paso 1: pedir codigo ---
 same => n(loop),Playback(despues-del-tono-marque-codigo)
 same => n,Playback(beep)
 same => n,Read(CODE,,8,,3,5)
 same => n,GotoIf($["${CODE}" = ""]?fin)
 ; --- Validar codigo en la BD ---
 same => n,AGI(/var/lib/asterisk/agi-bin/pocsag_check.py,${CODE})
 same => n,GotoIf($["${POCSAG_VALID}" = "1"]?pedir_mensaje:codigo_invalido)
 same => n(codigo_invalido),Playback(codigo-inexistente)
 same => n,Playback(marque-otro-codigo)
 same => n,Wait(0.5)
 same => n,Goto(loop)
 ; --- Paso 2: pedir mensaje ---
 same => n(pedir_mensaje),Playback(despues-de-la-senal-su-mensaje)
 same => n,Playback(beep)
 same => n,Read(MESSAGE,,16,,3,10)
 same => n,GotoIf($["${MESSAGE}" = ""]?mensaje_vacio:enviar)
 ; --- Procesar y enviar POCSAG ---
 same => n(enviar),AGI(/var/lib/asterisk/agi-bin/pocsag_handler.py,${CALLERID(num)},${CODE},${MESSAGE})
 same => n,GotoIf($["${POCSAG_RESULT}" = "ok"]?ok:fail)
 same => n(ok),Playback(confirmado)
 same => n,Hangup()
 same => n(fail),Playback(error-envio)
 same => n,Wait(1)
 same => n,Goto(loop)
 same => n(mensaje_vacio),Playback(mensaje-vacio)
 same => n,Goto(pedir_mensaje)
 same => n(fin),Hangup()

; Handlers estandar
exten => h,1,Hangup()
exten => i,1,Hangup()
exten => t,1,Hangup()

[default]
include => from-hospital