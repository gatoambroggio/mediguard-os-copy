name: Build Firmware POCSAG 512 baud + 149.255 MHz

on:
  push:
    branches: [main]
    paths:
      - 'src/zetronpoc/firmware/mmdvm_hs_512/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libstdc++-arm-none-eabi-newlib libnewlib-arm-none-eabi

      - name: Clone & patch MMDVM_HS
        working-directory: src/zetronpoc/firmware/mmdvm_hs_512
        run: |
          chmod +x clone_and_patch.sh
          ./clone_and_patch.sh

      - name: Verify patches
        working-directory: src/zetronpoc/firmware/mmdvm_hs_512
        run: |
          python3 tools/verify_patches.py MMDVM_HS

      - name: Build firmware (LIBRE_KIT_ADF7021)
        working-directory: src/zetronpoc/firmware/mmdvm_hs_512
        run: |
          chmod +x build_firmware.sh
          ./build_firmware.sh MMDVM_HS librekit

      - name: Build firmware (NANO_HOTSPOT)
        working-directory: src/zetronpoc/firmware/mmdvm_hs_512
        run: |
          ./build_firmware.sh MMDVM_HS nanohotspot

      - name: Verify .bin files were generated
        run: |
          for BIN in \
            src/zetronpoc/firmware/mmdvm_hs_512/firmware_pocsag512_149mhz.bin \
            src/zetronpoc/firmware/mmdvm_hs_512/firmware_pocsag512_149mhz_nano.bin ; do
            if [ ! -f "$BIN" ]; then
              echo "ERROR: no se genero $BIN"
              exit 1
            fi
            echo "Binary generated: $BIN ($(stat -c%s "$BIN") bytes)"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware_pocsag512_149mhz
          path: |
            src/zetronpoc/firmware/mmdvm_hs_512/firmware_pocsag512_149mhz.bin
            src/zetronpoc/firmware/mmdvm_hs_512/firmware_pocsag512_149mhz_nano.bin

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocsag512-149mhz-latest
          name: Firmware POCSAG 512 baud + 149.255 MHz
          body: |
            Firmware MMDVM_HS compilado con:
            - TCXO: 14.7456 MHz (OSC=14745600)
            - Frecuencia: VHF1_MAX extendido a 150 MHz (soporta 149.255 MHz)
            - Baud: 512 baud POCSAG (REG3 del ADF7021 reconfigurado)
            - UART host, SIMPLEX (sin DUPLEX), standalone (flash a 0x08000000)

            Dos variantes de board (los clones chinos del Nano hotSPOT varian por lote):
            - firmware_pocsag512_149mhz.bin       -> LIBRE_KIT_ADF7021
            - firmware_pocsag512_149mhz_nano.bin  -> NANO_HOTSPOT

            Flashear por serial (el instalador prueba las dos solo):
              sudo apt install stm32flash gpiod
              sudo ./instalar_firmware_mmdvm.sh
          files: |
            src/zetronpoc/firmware/mmdvm_hs_512/firmware_pocsag512_149mhz.bin
            src/zetronpoc/firmware/mmdvm_hs_512/firmware_pocsag512_149mhz_nano.bin
          prerelease: false
          draft: false