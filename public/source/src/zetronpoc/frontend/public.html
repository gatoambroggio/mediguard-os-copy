<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZetronPOC · Envío de mensajes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{--bg:#f1f5f9;--panel:#ffffff;--line:#e2e8f0;--line2:#cbd5e1;--txt:#0f172a;--mut:#64748b;--acc:#1d4ed8;--acc2:#0ea5e9;--acc3:#6366f1;--ok:#16a34a;--err:#dc2626;--warn:#d97706;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Rajdhani',sans-serif;color:var(--txt);background:radial-gradient(1200px 600px at 10% -10%,rgba(14,165,233,.12),transparent 60%),radial-gradient(1000px 500px at 110% 10%,rgba(99,102,241,.12),transparent 60%),var(--bg);min-height:100vh;padding:1rem}
.brand,.btn,h1,h2{font-family:'Orbitron',sans-serif;letter-spacing:.04em}
.mono{font-family:'JetBrains Mono',monospace}
.wrap{max-width:880px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem .2rem 1.2rem}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:800;font-size:1.25rem}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc2),var(--acc3));display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(99,102,241,.35)}
.brand small{display:block;font-family:'Rajdhani';font-weight:600;font-size:.72rem;color:var(--mut);letter-spacing:.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.4rem 1.5rem;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-bottom:1.1rem}
h1{font-size:1.5rem;margin-bottom:.2rem}
.sub{color:var(--mut);font-size:.92rem;margin-bottom:1.1rem}
label{display:block;font-weight:600;font-size:.82rem;color:var(--mut);margin:.7rem 0 .3rem}
input,select,textarea{width:100%;font-family:'Rajdhani';font-size:1rem;font-weight:600;color:var(--txt);background:#f8fafc;border:1.5px solid var(--line2);border-radius:10px;padding:.7rem .85rem;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc3);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.12)}
textarea{resize:vertical;min-height:96px;font-family:'JetBrains Mono';font-weight:500}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;margin-top:1.2rem;border:none;cursor:pointer;font-weight:700;font-size:1.02rem;color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc3));padding:.85rem 1rem;border-radius:12px;box-shadow:0 10px 26px rgba(99,102,241,.35);transition:.15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:wait}
.btn .dot{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:p 1.2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.msg{margin-top:1rem;padding:.8rem 1rem;border-radius:10px;font-weight:600;font-size:.92rem;display:none}
.msg.show{display:block}
.msg.ok{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.msg.err{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
.msg.info{background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc}
.hist{display:flex;flex-direction:column;gap:.5rem}
.hi{display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:center;padding:.6rem .8rem;border:1px solid var(--line);border-radius:10px;background:#f8fafc}
.hi .badge{font-family:'JetBrains Mono';font-size:.72rem;font-weight:700;padding:.25rem .5rem;border-radius:6px}
.hi .b-env{background:#dcfce7;color:#15803d}.hi .b-enc{background:#fef9c3;color:#a16207}.hi .b-err{background:#fee2e2;color:#b91c1c}.hi .b-fall{background:#fee2e2;color:#b91c1c}
.hi .cap{font-family:'JetBrains Mono';font-size:.78rem;color:var(--mut)}
.hi .txt{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi .ts{font-family:'JetBrains Mono';font-size:.72rem;color:var(--mut)}
.empty{color:var(--mut);font-style:italic;text-align:center;padding:1.2rem}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:1.4rem 0 .6rem}
.tag{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:700;color:var(--acc3);background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:.25rem .7rem}
.hint{font-size:.78rem;font-weight:600;margin-top:.35rem;color:var(--mut)}
.hint.ok{color:var(--ok)}.hint.err{color:var(--err)}
.codewrap{position:relative}
.codeDrop{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.14);z-index:50;display:none}
.codeDrop.show{display:block}
.codeDrop .item{display:flex;flex-direction:column;gap:.12rem;padding:.5rem .8rem;cursor:pointer;border-bottom:1px solid var(--line);font-family:'Rajdhani'}
.codeDrop .item:last-child{border-bottom:none}
.codeDrop .item:hover{background:#eef2ff}
.codeDrop .itemCod{font-weight:700;font-size:.9rem;color:var(--acc)}
.codeDrop .itemMeta{font-size:.76rem;color:var(--mut)}
.codeDrop .item .tag{margin-left:.3rem}
.codeDrop .empty{padding:.8rem;text-align:center;color:var(--mut);font-style:italic}
</style></head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">📻</div><div>ZetronPOC<small>MediGuard OS · Paginación hospitalaria</small></div></div>
    <span class="tag">● Envío público</span>
  </header>

  <div class="card">
    <h1>Enviar mensaje</h1>
    <div class="sub">Elegí el código de pager o grupo, escribí el mensaje y enviá. La transmisión POCSAG sale por MMDVM.</div>
    <form id="f">
      <div class="row">
        <div>
          <label for="codigo">Código (pager / grupo)</label>
          <div class="codewrap">
            <input id="codigo" name="codigo" placeholder="escribí el código…" autocomplete="off" required>
            <div id="codeDrop" class="codeDrop"></div>
          </div>
          <div id="codesHint" class="hint">cargando códigos…</div>
        </div>
        <div>
          <label for="plantilla">Plantilla (opcional)</label>
          <select id="plantilla"><option value="">— sin plantilla —</option></select>
        </div>
      </div>
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" placeholder="Escribí el mensaje a transmitir…" required></textarea>
      <button class="btn" id="send" type="submit"><span class="dot"></span> Enviar</button>
      <div class="msg" id="res"></div>
    </form>
  </div>

  <div class="card">
    <h2 style="font-size:1.05rem;margin-bottom:.9rem">Últimos envíos</h2>
    <div class="hist" id="hist"><div class="empty">cargando…</div></div>
  </div>

  <footer>ZetronPOC v2.0 · POCSAG sobre MMDVM · MediGuard OS<br><span id="srvTime" class="mono" style="font-size:.72rem;color:var(--mut)">servidor: --:--:--</span></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const res = $("#res");
function show(cls, txt){ res.className = "msg show " + cls; res.textContent = txt; }
function fmtEstado(e){ return ({enviado:"b-env",encolado:"b-enc",error:"b-err",fallido:"b-fall"}[e]) || "b-enc"; }

let CATALOG=[];
let SEL_FUNC="alphanumeric";
function applyMsgMode(){
  const m=$("#mensaje");
  if(SEL_FUNC==="numeric"){
    m.inputMode="numeric";
    m.placeholder="Solo números (pager numérico)";
    m.value=m.value.replace(/\D/g,"");
  }else{
    m.inputMode="text";
    m.placeholder="Escribí el mensaje a transmitir…";
  }
}
function normalizeAscii(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^ -~\n\r]/g,"");
}
$("#mensaje").addEventListener("input", e=>{ if(SEL_FUNC==="numeric") e.target.value=e.target.value.replace(/\D/g,""); });
async function _fetchCatalog(url){
  try{
    const r = await fetch(url);
    if(!r.ok){ return {err:"HTTP "+r.status, body:(await r.text()).slice(0,180)}; }
    return {data: await r.json()};
  }catch(e){ return {err:"red", body:e.message}; }
}
async function loadCatalog(){
  const hint=$("#codesHint");
  const [p,g,pl] = await Promise.all([_fetchCatalog("/api/pagers?q="),_fetchCatalog("/api/grupos?q="),_fetchCatalog("/api/plantillas")]);
  const errs=[p,g].filter(x=>x.err).map(x=>x.err+": "+x.body);
  if(errs.length){ if(hint){hint.textContent="Error al cargar códigos → "+errs.join(" | ");hint.className="hint err";} return; }
  CATALOG=[...(p.data||[]),...(g.data||[])];
  if(hint){ hint.textContent=CATALOG.length+" código(s) cargados · escribí para buscar"; hint.className=CATALOG.length?"hint ok":"hint err"; }
  const sel=$("#plantilla");
  (pl.data||[]).filter(t=>t.activo).forEach(t=>{
    const o=document.createElement("option");
    o.value=t.id; o.textContent=t.nombre;
    o.dataset.msg=t.mensaje||"";
    sel.appendChild(o);
  });
}
function renderDrop(q){
  const drop=$("#codeDrop");
  const s=q.trim().toLowerCase();
  const list = s ? CATALOG.filter(x=>{
    const c=(x.codigo||"").toLowerCase(), n=(x.nombre||x.descripcion||"").toLowerCase(), cap=(x.cap_code||"").toLowerCase();
    return c.includes(s)||n.includes(s)||cap.includes(s);
  }) : CATALOG;
  if(!list.length){ drop.innerHTML='<div class="empty">sin coincidencias para "'+q.replace(/</g,"&lt;")+'"</div>'; drop.classList.add("show"); return; }
  drop.innerHTML = list.map(x=>{
    const label=(x.descripcion||x.nombre||"").replace(/</g,"&lt;");
    const cap=x.cap_code?(" · cap "+x.cap_code):"";
    const tipo=x.miembros?"grupo":"pager";
    const esc=(x.codigo||"").replace(/"/g,"&quot;").replace(/</g,"&lt;");
    return `<div class="item" data-codigo="${esc}" data-func="${x.funcion||'alphanumeric'}"><span class="itemCod">${(x.codigo||"").replace(/</g,"&lt;")} <span class="tag">${tipo}</span></span><span class="itemMeta">${label}${cap}</span></div>`;
  }).join("");
  drop.classList.add("show");
  drop.querySelectorAll(".item").forEach(it=>it.addEventListener("click",()=>{
    $("#codigo").value=it.dataset.codigo;
    SEL_FUNC=(it.dataset.func||"alphanumeric").toLowerCase();
    applyMsgMode();
    drop.classList.remove("show"); drop.innerHTML="";
    $("#mensaje").focus();
  }));
}

async function loadHist(){
  try{
    const r = await fetch("/api/historial/public");
    const data = await r.json();
    const rows = (data.rows||[]).slice(0,12);
    const h = $("#hist");
    if(!rows.length){ h.innerHTML = '<div class="empty">sin envíos registrados</div>'; return; }
    h.innerHTML = rows.map(x=>`<div class="hi">
      <span class="badge ${fmtEstado(x.estado)}">${x.estado||"—"}</span>
      <div><div class="txt">${(x.mensaje||"").replace(/</g,"&lt;")}</div><span class="cap">${x.codigo||"—"} · ${x.cap_code||"—"}</span></div>
      <span class="ts">${(x.fecha_hora||"").slice(5,16)}</span>
    </div>`).join("");
  }catch(e){ $("#hist").innerHTML = '<div class="empty">no se pudo cargar el historial</div>'; }
}

$("#plantilla").addEventListener("change", e=>{
  const opt = e.target.selectedOptions[0];
  if(opt && opt.dataset.msg && !$("#mensaje").value){
    let v=opt.dataset.msg;
    if(SEL_FUNC==="numeric") v=v.replace(/\D/g,"");
    $("#mensaje").value=v;
  }
});

$("#codigo").addEventListener("input", e=>{
  renderDrop(e.target.value);
  const v=e.target.value.trim().toLowerCase();
  const m=CATALOG.find(x=>(x.codigo||"").toLowerCase()===v);
  SEL_FUNC=(m&&m.funcion)?m.funcion.toLowerCase():"alphanumeric";
  applyMsgMode();
});
$("#codigo").addEventListener("focus", e=>renderDrop(e.target.value));
document.addEventListener("click", e=>{
  if(!e.target.closest(".codewrap")){ const d=$("#codeDrop"); if(d){ d.classList.remove("show"); d.innerHTML=""; } }
});

$("#f").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const codigo = $("#codigo").value.trim();
  let mensaje = $("#mensaje").value.trim();
  mensaje = normalizeAscii(mensaje);
  if(SEL_FUNC==="numeric") mensaje = mensaje.replace(/\D/g,"");
  if(!codigo || !mensaje){ show("err","Falta el código o el mensaje (revisá acentos/contenido)."); return; }
  const btn = $("#send"); btn.disabled = true; show("info","Enviando…");
  try{
    const r = await fetch("/api/enviar",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({codigo, mensaje, origen:"web"})
    });
    const d = await r.json();
    if(d.status === "encolado" || d.status === "ok"){
      show("ok", "Mensaje encolado OK (id " + (d.id||"") + "). Saldrá por MMDVM.");
      $("#mensaje").value=""; $("#codigo").value=""; SEL_FUNC="alphanumeric"; applyMsgMode();
      const dd=$("#codeDrop"); if(dd){ dd.classList.remove("show"); dd.innerHTML=""; }
      loadHist();
    } else {
      show("err","No se pudo enviar: "+(d.detalle||d.status||"error"));
    }
  }catch(e){ show("err","Error de red: "+e.message); }
  finally{ btn.disabled = false; }
});

async function loadSrvTimePub(){try{const r=await fetch('/api/server/time').then(r=>r.json());if(r&&r.datetime){const el=document.getElementById('srvTime');if(el)el.textContent='servidor: '+r.datetime+' ('+(r.timezone||'')+')';}}catch(e){}}
loadCatalog(); loadHist(); setInterval(loadHist, 8000); loadSrvTimePub(); setInterval(loadSrvTimePub, 30000);
</script>
</body></html>
