<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>MediGuard OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{--bg:#f1f5f9;--panel:#ffffff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--prim:#1d4ed8;--acc:#0ea5e9;--ok:#16a34a;--err:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif}
body{min-height:100vh;color:var(--txt);background:var(--bg);display:flex;flex-direction:column}
.wrap{max-width:560px;margin:auto;padding:2rem;width:100%}
.head{text-align:center;margin-bottom:1.6rem}
.logo{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;margin:0 auto .8rem;background:var(--prim);color:#fff;font-size:30px;font-weight:800;box-shadow:0 6px 18px rgba(29,78,216,.25)}
h1{font-size:1.5rem;font-weight:800;color:var(--txt);letter-spacing:-.02em}
.sub{color:var(--mut);font-size:.78rem;margin-top:.25rem}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.tabbtn{flex:1;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:.6rem;background:var(--panel);color:var(--mut);font-weight:600;font-size:.85rem;transition:.15s}
.tabbtn.active{background:var(--prim);color:#fff;border-color:var(--prim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.5rem;box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:1rem}
label{display:block;font-size:.72rem;color:var(--mut);margin-bottom:.3rem;font-weight:600}
input,textarea,select{width:100%;background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:.6rem .7rem;font-size:.95rem;outline:none;transition:.15s;font-family:'Inter',sans-serif}
input:focus,textarea:focus,select:focus{border-color:var(--prim);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.list{position:relative;margin-top:.4rem}
ul{position:absolute;z-index:5;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:9px;max-height:240px;overflow:auto;list-style:none;padding:.3rem;box-shadow:0 8px 24px rgba(15,23,42,.1)}
li{padding:.5rem .6rem;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
li:hover{background:#f1f5f9}
.muted{font-size:.72rem;color:var(--mut)}
.tag{font-size:.62rem;color:var(--acc);font-weight:700}
.btn{width:100%;margin-top:1rem;cursor:pointer;border:none;border-radius:10px;padding:.7rem;font-weight:700;font-size:.9rem;background:var(--prim);color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.25)}
.btn:hover{background:var(--acc)}
.dlbtn{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--prim);border-radius:9px;padding:.5rem 1.1rem;font-weight:700;font-size:.78rem}
.toast{margin-top:1rem;padding:.7rem;border-radius:9px;font-size:.85rem;display:none}
.toast.show{display:block}
.toast.ok{background:#dcfce7;border:1px solid #86efac;color:var(--ok)}
.toast.err{background:#fee2e2;border:1px solid #fca5a5;color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:.6rem}
th,td{text-align:left;padding:.45rem;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.badge{padding:.1rem .45rem;border-radius:999px;font-size:.66rem;font-weight:700;font-family:'JetBrains Mono',monospace}
.badge.ok{background:#dcfce7;color:var(--ok)}
.badge.err{background:#fee2e2;color:var(--err)}
.badge.mut{background:#f1f5f9;color:var(--mut)}
.hrow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.stat{position:fixed;top:1rem;right:1rem;z-index:2}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .7rem;border-radius:999px;font-size:.72rem;background:#dcfce7;color:var(--ok);border:1px solid #86efac;font-weight:600}
.pill.off{background:#fee2e2;color:var(--err);border-color:#fca5a5}
</style></head>
<body>
<div class="stat"><span id="h" class="pill">…</span></div>
<div class="wrap">
  <div class="head"><div class="logo" id="logo">⏧</div><h1 id="titulo">MediGuard OS</h1><div class="sub" id="sub">Despacho de mensajeria</div></div>
  <div class="tabs">
    <button class="tabbtn active" id="tb-enviar" onclick="showTab('enviar')">Enviar</button>
    <button class="tabbtn" id="tb-hist" onclick="showTab('hist')">Historial</button>
  </div>
  <div class="tabpane active" id="tp-enviar">
    <div class="card">
      <label>Buscar destinatario</label>
      <input id="q" autocomplete="off" placeholder="Nombre, codigo o area...">
      <ul id="list" style="display:none"></ul>
      <div style="margin-top:1rem"><label>Mensaje alfanumerico</label><textarea id="msg" rows="3" placeholder="Escriba el mensaje al pager..."></textarea></div>
      <button class="btn" onclick="send()">TRANSMITIR</button>
      <div id="res" class="toast"></div>
    </div>
  </div>
  <div class="tabpane" id="tp-hist">
    <div class="card">
      <div class="hrow">
        <label style="margin:0">Historial de envios</label>
        <button class="dlbtn" onclick="descargarHistorial()">Descargar CSV</button>
      </div>
      <div style="max-height:360px;overflow:auto">
        <table><thead><tr><th>Fecha</th><th>Origen</th><th>Codigo</th><th>Cap</th><th>Mensaje</th><th>Estado</th></tr></thead>
        <tbody id="histBody"><tr><td colspan="6" style="text-align:center;opacity:.6;padding:.6rem">Cargando...</td></tr></tbody></table>
      </div>
    </div>
  </div>
</div>
<script>
let chosen=null,t=null;
const DEFAULTS={front_titulo:'MediGuard OS',front_subtitulo:'Despacho de mensajeria',front_logo:'⏧',front_color_primario:'#1d4ed8',front_color_acento:'#0ea5e9',front_color_fondo:'#f1f5f9',front_color_texto:'#0f172a',front_seccion_enviar:'1',front_seccion_historial:'1'};
function cfg(c,k){return (c&&c[k]!=null&&c[k]!=='')?c[k]:DEFAULTS[k];}
function aplicarConfig(c){
  document.title=cfg(c,'front_titulo');
  document.getElementById('titulo').textContent=cfg(c,'front_titulo');
  document.getElementById('sub').textContent=cfg(c,'front_subtitulo');
  document.getElementById('logo').textContent=cfg(c,'front_logo');
  const r=document.documentElement.style;
  r.setProperty('--prim',cfg(c,'front_color_primario'));
  r.setProperty('--acc',cfg(c,'front_color_acento'));
  r.setProperty('--bg',cfg(c,'front_color_fondo'));
  r.setProperty('--txt',cfg(c,'front_color_texto'));
  if(cfg(c,'front_seccion_enviar')!=='1'){document.getElementById('tb-enviar').style.display='none';document.getElementById('tp-enviar').style.display='none';}
  if(cfg(c,'front_seccion_historial')!=='1'){document.getElementById('tb-hist').style.display='none';document.getElementById('tp-hist').style.display='none';}
}
async function loadConfig(){try{const c=await fetch('/api/theme').then(r=>r.json());aplicarConfig(c);}catch(e){aplicarConfig(DEFAULTS);}}
function showTab(id){document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.remove('active');});document.querySelectorAll('.tabpane').forEach(function(p){p.classList.remove('active');});var tb=document.getElementById('tb-'+id),tp=document.getElementById('tp-'+id);if(tb&&tp){tb.classList.add('active');tp.classList.add('active');}if(id==='hist')loadHistorial();}
const q=document.getElementById('q'),list=document.getElementById('list');
q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(async()=>{const r=await fetch('/api/pagers'+(q.value?('?q='+encodeURIComponent(q.value)):'')).then(r=>r.json()).catch(()=>[]);const g=await fetch('/api/grupos'+(q.value?('?q='+encodeURIComponent(q.value)):'')).then(r=>r.json()).catch(()=>[]);const out=[];(r||[]).filter(x=>x.activo).forEach(x=>out.push({c:x.codigo,l:((x.nombre||'')+' '+(x.apellido||'')).trim()||x.codigo,t:'pager'}));(g||[]).filter(x=>x.activo).forEach(x=>out.push({c:x.codigo,l:x.nombre||x.codigo,t:'grupo'}));list.innerHTML=out.map(x=>`<li onclick="pick('${x.c}','${(x.l||'').replace(/'/g,'')}')"><span>${x.l} <span class="muted">${x.c}</span></span><span class="tag">${x.t}</span></li>`).join('');list.style.display=out.length?'block':'none';},180);});
document.addEventListener('click',e=>{if(e.target.id!=='q')list.style.display='none';});
function pick(c,l){chosen=c;q.value=l+' ('+c+')';list.style.display='none';}
async function send(){const t=document.getElementById('res');if(!chosen){t.className='toast show err';t.textContent='Seleccione destinatario';return;}const m=document.getElementById('msg').value.trim();if(!m){t.className='toast show err';t.textContent='Escriba un mensaje';return;}t.className='toast show ok';t.textContent='Transmitiendo...';try{const r=await fetch('/api/enviar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:chosen,mensaje:m,origen:'publico'})}).then(r=>r.json());if(r.status==='enviado'){t.className='toast show ok';t.textContent='Mensaje transmitido.';document.getElementById('msg').value='';loadHistorial();}else if(r.status==='encolado'){t.className='toast show ok';t.textContent='Encolado (en proceso).';loadHistorial();}else{t.className='toast show err';t.textContent='Error: '+(r.detalle||r.error||'fallo');}}catch(e){t.className='toast show err';t.textContent='Error de conexion';}}
async function loadHistorial(){try{const r=await fetch('/api/historial/public').then(function(r){return r.json();});const rows=(r&&r.rows)||[];const tb=document.getElementById('histBody');if(!rows.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;opacity:.6;padding:.6rem">Sin envios</td></tr>';return;}tb.innerHTML=rows.map(function(x){var e=x.estado||'-';var cls=e==='enviado'?'ok':e==='error'?'err':'mut';return '<tr><td>'+String(x.fecha_hora||'').slice(0,16)+'</td><td>'+(x.interno_origen||'-')+'</td><td>'+(x.codigo||'-')+'</td><td>'+(x.cap_code||'-')+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+String(x.mensaje||'').replace(/"/g,'&quot;')+'">'+(x.mensaje||'')+'</td><td><span class="badge '+cls+'">'+e+'</span></td></tr>';}).join('');}catch(e){document.getElementById('histBody').innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--err);padding:.6rem">Error al cargar historial</td></tr>';}}
async function descargarHistorial(){try{var r=await fetch('/api/historial/public').then(function(r){return r.json();});var rows=(r&&r.rows)||[];var lines=['fecha_hora,interno,codigo,cap_code,mensaje,baudios,estado,observaciones'];rows.forEach(function(x){lines.push([x.fecha_hora,x.interno_origen,x.codigo,x.cap_code,JSON.stringify(x.mensaje||''),x.baudios,x.estado,JSON.stringify(x.observaciones||'')].join(','));});var txt=lines.join('\n');var blob=new Blob([txt],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='historial_zetronpoc.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}catch(e){alert('No se pudo descargar el historial');}}
async function health(){try{const h=await fetch('/api/health').then(r=>r.json());const p=document.getElementById('h');p.textContent=h.status==='ok'?'EN LINEA':'CAIDO';p.className='pill '+(h.status==='ok'?'':'off');}catch(e){}}
loadConfig();health();setInterval(health,20000);loadHistorial();
</script>
</body></html>
