; ============================================================================
; server.conf - Configuración general del sistema (variante cliente)
; v1.0client
; ============================================================================

[general]
; Interno de paginación IVR (interno lógico, no registrado en la central)
pocsag_extension=2184

; Internos registrados contra la central del hospital
hospital_extensions=3000,3001,3002,3003

; Número que el hospital enruta hacia el servidor (primer interno libre)
hospital_ring_number=177

; IP de la central del hospital (reemplazar por la real)
hospital_pbx_ip=IP_HOSPITAL

; Baudios por defecto
default_baud=1200

[version]
version=1.0client