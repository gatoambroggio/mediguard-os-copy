; ============================================================================
; pjsip_hospital.conf - Template inicial (POCSAG Server v1.01, modo cliente)
;
; IMPORTANTE: Este archivo se REGENERARA desde el panel admin cuando pulses
; "Aplicar a Asterisk". La configuracion final se genera desde la base de datos.
;
; SELF-CONTAINED: incluye [transport-udp] + endpoint + identify + registros.
; NO depende de pjsip_pocsag.conf ni de ningun otro archivo.
;
; pjsip.conf solo tiene: #include pjsip_hospital.conf
;
; Internos 2000-2010 registran contra FreePBX (default 192.168.2.97).
; Formato de registro que funciona con FreePBX: sin puerto y sin from_user.
; Reemplazar IP_HOSPITAL y CAMBIAR_PASSWORD_XXXX antes del primer uso,
; o mejor: usar el panel admin (Parametros -> Extensiones -> Aplicar).
; ============================================================================

; === Transporte UDP (self-contained) ===
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; === Endpoint unico para llamadas entrantes del hospital ===
[hospital-inbound]
type=endpoint
context=pocsag-incoming
disallow=all
allow=ulaw,alaw
transport=transport-udp
aors=hospital-inbound
trust_id_inbound=yes
direct_media=no
force_rport=yes
rtp_symmetric=yes
inband_progress=yes
allow_subscribe=no

[hospital-inbound]
type=aor
max_contacts=0

; Identify: asocia la IP del hospital al endpoint inbound
[hospital-ident]
type=identify
endpoint=hospital-inbound
match=IP_HOSPITAL

; --- Registro del interno 2000 ---
[reg-2000]
type=registration
transport=transport-udp
outbound_auth=auth-2000
server_uri=sip:IP_HOSPITAL
client_uri=sip:2000@IP_HOSPITAL
retry_interval=60
expiration=3600
contact_user=2000

[auth-2000]
type=auth
auth_type=userpass
username=2000
password=CAMBIAR_PASSWORD_2000

